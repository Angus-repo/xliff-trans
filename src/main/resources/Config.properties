# File: Config.properties

# OpenAI API Key
api_key=YOUR_API_KEY
model_version=gpt-4o-mini

# Reasoning effort: none, minimal, low, medium, high, xhigh, max (model-dependent).
# Missing/blank = medium. "default" omits the parameter and uses the model default.
# GPT-4 / GPT-3.5 families do not receive this parameter.
# GPT-6 Luna supports none, low, medium, high, xhigh, max.
reasoning_effort=medium

batch_size=50

