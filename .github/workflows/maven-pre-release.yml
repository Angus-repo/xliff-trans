name: Build distributions

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and test distributions
        run: mvn -B package -P"${{ matrix.os }},withJRE" --file pom.xml
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/xliff-trans-*.zip
            target/xliff-trans-*.tar.gz
            target/xliff-trans-*.jar

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          path: artifacts
      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            artifacts/distributions-ubuntu-latest/xliff-trans-*.jar \
            artifacts/distributions-ubuntu-latest/xliff-trans-*.zip \
            artifacts/distributions-ubuntu-latest/xliff-trans-*.tar.gz \
            artifacts/distributions-macos-latest/xliff-trans-*.tar.gz \
            artifacts/distributions-windows-latest/xliff-trans-*.zip \
            --clobber
